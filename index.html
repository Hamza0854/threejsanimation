<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car Interior 360° Viewer</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Photo Sphere Viewer (built on Three.js) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css">

  <style>
    :root {
      --accent: #c8a45c;        /* <-- main brand colour (gold) */
      --dark: #0e0f12;
    }
    body { background: var(--dark); color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }

    /* ---------- Section title ---------- */
    .section-title { letter-spacing: .25em; text-transform: uppercase; font-weight: 300; }
    .section-title span { color: var(--accent); font-weight: 600; }

    /* ---------- Viewer box ---------- */
    .viewer-wrap { position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    #viewer { width: 100%; height: 78vh; min-height: 420px; }

    /* ---------- Scene tabs (top-left) ---------- */
    .scene-tabs { position: absolute; top: 18px; left: 18px; z-index: 10; }
    .scene-tabs .btn { background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.2);
                       backdrop-filter: blur(6px); font-size: .85rem; }
    .scene-tabs .btn.active { background: var(--accent); border-color: var(--accent); color: #111; }

    /* ---------- Tool buttons (top-right) ---------- */
    .tool-bar { position: absolute; top: 18px; right: 18px; z-index: 10; display: flex; gap: 8px; }
    .tool-bar .btn { width: 42px; height: 42px; border-radius: 50%; padding: 0; background: rgba(0,0,0,.55);
                     color: #fff; border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(6px); }
    .tool-bar .btn.active, .tool-bar .btn:hover { background: var(--accent); color: #111; }

    /* ---------- Trim colour picker (bottom-left) ---------- */
    .trim-picker { position: absolute; bottom: 60px; left: 18px; z-index: 10; background: rgba(0,0,0,.55);
                   backdrop-filter: blur(6px); padding: 10px 14px; border-radius: 40px; display: flex; align-items: center; gap: 10px; }
    .trim-picker small { opacity: .8; }
    .trim-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); cursor: pointer; transition: .2s; }
    .trim-dot.active { border-color: var(--accent); transform: scale(1.2); }

    /* ---------- Hotspot style ---------- */
    .hotspot { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.95);
               border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center;
               color: #111; font-size: 14px; cursor: pointer; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(200,164,92,.7); }
      70%  { box-shadow: 0 0 0 16px rgba(200,164,92,0); }
      100% { box-shadow: 0 0 0 0 rgba(200,164,92,0); }
    }

    /* ---------- Info card (right side) ---------- */
    .info-card { position: absolute; right: 18px; bottom: 60px; width: 320px; max-width: calc(100% - 36px); z-index: 11;
                 background: rgba(14,15,18,.88); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12);
                 border-radius: 14px; color: #fff; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .35s; }
    .info-card.show { transform: none; opacity: 1; pointer-events: auto; }
    .info-card img { border-radius: 14px 14px 0 0; height: 150px; object-fit: cover; }
    .info-card h5 { color: var(--accent); }

    /* ---------- Hint + dev toast ---------- */
    .drag-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9; pointer-events: none;
                 background: rgba(0,0,0,.55); padding: 10px 20px; border-radius: 30px; transition: opacity .6s; }
    .dev-toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 12;
                 background: #198754; padding: 8px 16px; border-radius: 8px; font-family: monospace; display: none; }

    @media (max-width: 576px) {
      #viewer { height: 70vh; }
      .scene-tabs .btn { font-size: .75rem; padding: 4px 8px; }
      .info-card { bottom: 110px; }
    }
  </style>
</head>
<body>

<section class="container-fluid py-5 px-lg-5">
  <div class="text-center mb-4">
    <h2 class="section-title">Explore the <span>Interior</span></h2>
    <p class="text-secondary mb-0">Drag to look around · Scroll or pinch to zoom · Tap the dots to discover features</p>
  </div>

  <div class="viewer-wrap">
    <div id="viewer"></div>

    <!-- Scene buttons (filled by JS from CONFIG) -->
    <div class="scene-tabs btn-group" id="sceneTabs"></div>

    <!-- Tools -->
    <div class="tool-bar">
      <button class="btn" id="btnRotate" title="Auto rotate"><i class="bi bi-arrow-repeat"></i></button>
      <button class="btn" id="btnReset"  title="Reset view"><i class="bi bi-bullseye"></i></button>
      <button class="btn" id="btnFull"   title="Fullscreen"><i class="bi bi-arrows-fullscreen"></i></button>
    </div>

    <!-- Trim colours (filled by JS) -->
    <div class="trim-picker" id="trimPicker"><small>Trim</small></div>

    <!-- Feature info card -->
    <div class="card info-card" id="infoCard">
      <img id="infoImg" class="card-img-top d-none" alt="">
      <div class="card-body">
        <button type="button" class="btn-close btn-close-white float-end" id="infoClose"></button>
        <h5 class="card-title" id="infoTitle"></h5>
        <p class="card-text small mb-0" id="infoText"></p>
      </div>
    </div>

    <div class="drag-hint" id="dragHint"><i class="bi bi-hand-index me-2"></i>Drag to explore</div>
    <div class="dev-toast" id="devToast"></div>
  </div>
</section>

<!-- Three.js + Photo Sphere Viewer as ES modules -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
    "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.module.js",
    "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin/index.module.js"
  }
}
</script>

<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
import { AutorotatePlugin } from '@photo-sphere-viewer/autorotate-plugin';

/* =====================================================================
   ⚙️  CONFIG — EVERYTHING YOU CUSTOMIZE IS HERE
   ===================================================================== */
const DEMO = 'nam-cz-zjPyfetYcOQ-unsplash.jpg'; // demo image only — replace!

const CONFIG = {
  devMode: true,               // true = click in viewer to get hotspot coordinates. Set false for live site.
  autoRotate: false,            // start rotating automatically
  rotateSpeed: '0.6rpm',       // rotation speed
  introAnimation: true,        // zoom-in when page loads
  transitionMs: 1200,          // fade time between scenes / trims

  // Trim colours. "key" must match the keys used in each scene's "images".
  trims: [
    { key: 'black', label: 'Midnight Black', color: '#1b1b1b' },
    { key: 'brown', label: 'Saddle Brown',   color: '#7a4a2a' },
  ],

  // Camera positions inside the car
  scenes: [
    {
      id: 'front',
      label: 'Front Cabin',
      images: { black: DEMO, brown: DEMO },      // e.g. 'images/front-black.jpg'
      start: { yaw: '0deg', pitch: '-5deg', zoom: 40 },
      hotspots: [
        { id: 'screen', yaw: '0deg',   pitch: '-10deg', icon: 'bi-display',
          title: '15.6-inch Touchscreen',
          text: 'Central touchscreen with Apple CarPlay and Android Auto support.',
          image: '' },                               // optional photo for the card
        { id: 'heated', yaw: '-40deg', pitch: '-25deg', icon: 'bi-thermometer-sun',
          title: 'Heated & Ventilated Seats',
          text: 'Front seats warm you up in winter and keep you cool in summer.' },
        { id: 'roof',   yaw: '20deg',  pitch: '55deg',  icon: 'bi-brightness-high',
          title: 'Panoramic Sunroof',
          text: 'Brings natural light into the whole cabin.' },
      ],
    },
    {
      id: 'rear',
      label: 'Rear Seats',
      images: { black: DEMO, brown: DEMO },
      start: { yaw: '180deg', pitch: '0deg', zoom: 40 },
      hotspots: [
        { id: 'space', yaw: '170deg', pitch: '-15deg', icon: 'bi-people',
          title: 'Spacious Passenger Area',
          text: 'Generous lateral room for rear passengers.' },
      ],
    },
    {
      id: 'trunk',
      label: 'Trunk',
      images: { black: DEMO, brown: DEMO },
      start: { yaw: '90deg', pitch: '-20deg', zoom: 30 },
      hotspots: [
        { id: 'cargo', yaw: '90deg', pitch: '-30deg', icon: 'bi-box-seam',
          title: 'Flexible Cargo Space',
          text: 'Fold the second row for a much longer load floor.' },
      ],
    },
  ],
};
/* ===================== END OF CONFIG ===================== */


let currentScene = CONFIG.scenes[0];
let currentTrim  = CONFIG.trims[0].key;

// ---------- Create viewer ----------
const viewer = new Viewer({
  container: document.getElementById('viewer'),
  panorama: currentScene.images[currentTrim],
  defaultYaw: currentScene.start.yaw,
  defaultPitch: currentScene.start.pitch,
  defaultZoomLvl: CONFIG.introAnimation ? 0 : currentScene.start.zoom,
  navbar: ['zoom', 'caption'],
  caption: currentScene.label,
  touchmoveTwoFingers: false,
  mousewheelCtrlKey: false,
  loadingTxt: 'Loading interior…',
  plugins: [
    [MarkersPlugin, { markers: [] }],
    [AutorotatePlugin, {
      autostartDelay: CONFIG.autoRotate ? 2500 : null,
      autostartOnIdle: CONFIG.autoRotate,
      autorotateSpeed: CONFIG.rotateSpeed,
      autorotatePitch: '0deg',
    }],
  ],
});

const markers = viewer.getPlugin(MarkersPlugin);
const rotator = viewer.getPlugin(AutorotatePlugin);

// ---------- Hotspots ----------
function toMarker(h) {
  return {
    id: h.id,
    position: { yaw: h.yaw, pitch: h.pitch },
    html: `<div class="hotspot"><i class="bi ${h.icon || 'bi-plus-lg'}"></i></div>`,
    size: { width: 30, height: 30 },
    anchor: 'center center',
    tooltip: { content: h.title, position: 'top center' },
    data: h,
  };
}
function loadHotspots() {
  markers.setMarkers(currentScene.hotspots.map(toMarker));
}

markers.addEventListener('select-marker', ({ marker }) => {
  rotator.stop();
  markers.gotoMarker(marker.id, '4rpm');
  showInfo(marker.data);
});

// ---------- Info card ----------
const card = document.getElementById('infoCard');
function showInfo(h) {
  document.getElementById('infoTitle').textContent = h.title;
  document.getElementById('infoText').textContent  = h.text;
  const img = document.getElementById('infoImg');
  if (h.image) { img.src = h.image; img.classList.remove('d-none'); } else { img.classList.add('d-none'); }
  card.classList.add('show');
}
document.getElementById('infoClose').onclick = () => card.classList.remove('show');

// ---------- Scene switching ----------
const tabs = document.getElementById('sceneTabs');
CONFIG.scenes.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'btn' + (i === 0 ? ' active' : '');
  b.textContent = s.label;
  b.onclick = () => goToScene(s, b);
  tabs.appendChild(b);
});

function goToScene(scene, btn) {
  if (scene === currentScene) return;
  currentScene = scene;
  tabs.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  card.classList.remove('show');
  markers.clearMarkers();
  viewer.setPanorama(scene.images[currentTrim], {
    transition: CONFIG.transitionMs,
    position: { yaw: scene.start.yaw, pitch: scene.start.pitch },
    zoom: scene.start.zoom,
    caption: scene.label,
  }).then(loadHotspots);
}

// ---------- Trim switching ----------
const picker = document.getElementById('trimPicker');
CONFIG.trims.forEach((t, i) => {
  const d = document.createElement('div');
  d.className = 'trim-dot' + (i === 0 ? ' active' : '');
  d.style.background = t.color;
  d.title = t.label;
  d.onclick = () => {
    if (t.key === currentTrim) return;
    currentTrim = t.key;
    picker.querySelectorAll('.trim-dot').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
    // keep the same camera angle while changing colour
    viewer.setPanorama(currentScene.images[currentTrim], {
      transition: CONFIG.transitionMs,
      position: viewer.getPosition(),
      zoom: viewer.getZoomLevel(),
    });
  };
  picker.appendChild(d);
});

// ---------- Tools ----------
const btnRotate = document.getElementById('btnRotate');
btnRotate.onclick = () => rotator.toggle();
rotator.addEventListener('autorotate', ({ autorotateEnabled }) =>
  btnRotate.classList.toggle('active', autorotateEnabled));

document.getElementById('btnReset').onclick = () => viewer.animate({
  yaw: currentScene.start.yaw, pitch: currentScene.start.pitch,
  zoom: currentScene.start.zoom, speed: '3rpm',
});
document.getElementById('btnFull').onclick = () => viewer.toggleFullscreen();

// ---------- Intro + drag hint ----------
viewer.addEventListener('ready', () => {
  loadHotspots();
  if (CONFIG.introAnimation) {
    viewer.animate({ zoom: currentScene.start.zoom, yaw: currentScene.start.yaw,
                     pitch: currentScene.start.pitch, speed: 2000 });
  }
}, { once: true });

const hint = document.getElementById('dragHint');
viewer.addEventListener('position-updated', () => { hint.style.opacity = 0; }, { once: true });
setTimeout(() => hint.style.opacity = 0, 5000);

// ---------- Dev mode: click to get hotspot coordinates ----------
if (CONFIG.devMode) {
  const toast = document.getElementById('devToast');
  viewer.addEventListener('click', ({ data }) => {
    if (data.rightclick) return;
    const deg = r => (r * 180 / Math.PI).toFixed(1) + 'deg';
    const txt = `yaw: '${deg(data.yaw)}', pitch: '${deg(data.pitch)}'`;
    toast.textContent = txt + '  (copied)';
    toast.style.display = 'block';
    navigator.clipboard?.writeText(txt);
    console.log(txt);
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.style.display = 'none', 3500);
  });
}
</script>
</body>
</html>
